# Servicios de infraestructura para desarrollo local.
# Levantar:  docker compose up -d
# Apagar:    docker compose down        (agrega -v para borrar también los datos)
services:
  db:
    image: postgres:17-alpine
    container_name: dashboard-db
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_dev   # solo desarrollo local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
